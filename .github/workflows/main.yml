# https://qiita.com/vZke/items/868eb9fd5289d2a25660

name: Run Pytest
on: [push]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.12'
      TEST_RESULTS_DIR: 'test-results'
      TEST_REPORT_FILE: 'pytest-results.xml'

    steps:
      # Repository setup
      - name: Checkout repository
        uses: actions/checkout@v2

      # Python environment setup
      - name: Configure Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Test execution
      - name: Execute pytest suite
        run: |
          mkdir -p ${{ env.TEST_RESULTS_DIR }}
          python -m pytest test --junit-xml ${{ env.TEST_RESULTS_DIR }}/${{ env.TEST_REPORT_FILE }}
        continue-on-error: true

      # Test results processing
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: pytest-results-python-${{ env.PYTHON_VERSION }}
          path: ${{ env.TEST_RESULTS_DIR }}/*.xml

      - name: Retrieve test artifacts
        if: always()
        uses: actions/download-artifact@v2
        with:
          path: artifacts

      - name: Publish test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          junit_files: artifacts/**/*.xml
